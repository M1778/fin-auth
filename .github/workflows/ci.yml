name: ci

on:
  push:
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # finc is built from source per https://github.com/M1778/Fin/blob/master/INSTALL.md
      # (needs LLVM 22, Conan 2, C++20). This is slow; keep as one step.
      - name: Install finc
        run: |
          curl -fsSL https://raw.githubusercontent.com/M1778/Fin/master/install.sh -o install.sh
          FIN_DIR="$HOME/Fin" sh install.sh
          echo "$HOME/Fin/build" >> "$GITHUB_PATH"

      - name: Frontend check (must pass)
        run: |
          finc --version
          finc src/auth.fin
          finc tests/test_auth.fin -I src
          finc examples/basic.fin -I src

      # Multi-file import lowering is partial in Fin 0.4.0 (imported Fin
      # function bodies are not always emitted into the caller's executable;
      # see Fin docs/guide/10-modules-and-imports.md). Keep running this so we
      # notice the day it starts working; do not gate merges on it yet.
      - name: Build and run tests (allowed to fail until imports lower)
        continue-on-error: true
        run: |
          finc tests/test_auth.fin -I src -o test_auth
          ./test_auth
